headlamp:
  config:
    extraArgs:
      - -in-cluster
    unsafeUseServiceAccountToken: true
  ingress:
    enabled: true
    hosts:
      - host: self.uat.bob.geocities.com
        paths:
        - path: /
          type: ImplementationSpecific      
    tls:
      - secretName: wildcard-tls
        hosts:
          - self.uat.bob.geocities.com