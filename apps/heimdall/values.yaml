heimdall:
  ingress:
    main:
      enabled: true
      hosts:
        - host: home.{{ .Values.global.domainName }}
          paths:
            - path: /
      ingressClassName: traefik
      annotations:
        kubernetes.io/ingress.class: traefik
      tls:
        - secretName: wildcard-tls
          hosts:
            -  home.{{ .Values.global.domainName }}
  persistence:
    config:
      enabled: true
  probes:
    startup:
      enabled: false
