shards: [dev, uat, prod]
controllerClusterRoles:
  - kargo-controller
  - kargo-controller-argocd
  - kargo-controller-rollouts

controllerRoles:
  - namespace: kargo
    name: kargo-controller
  - namespace: kargo-shared-resources
    name: kargo-shared-resources-controller-reader
  - namespace: kargo-system-resources
    name: kargo-system-resources-reader

kargo:
  api:
    host: kargo.sharedservices.bob.geocities.com
    tls:
      enabled: false
      terminatedUpstream: true
    ingress:
      enabled: true
      ingressClassName: traefik
      tls:
        enabled: true
        selfSignedCert: false
    secret:
      name: kargo-api-secrets