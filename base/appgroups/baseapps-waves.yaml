apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: baseappset-waves
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - clusters:
          selector:
            matchExpressions:
            - { key: cluster, operator: Exists }
      - list:
          elements:
            - { app: reflector, path: base/autoinstall/reflector, wave: "0"}
            - { app: external-secrets, path: base/autoinstall/external-secrets, wave: "1"}
            - { app: cert-manager, path: base/autoinstall/cert-manager, wave: "0"}
            - { app: manifests, path: base/autoinstall/manifests, wave: "1"}
  template:
    metadata:
      name: '{{ .app }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      labels:
        wave: '{{ .wave }}'
    spec:
      project: default
      destination:
        namespace: '{{ .app }}'
        server: https://kubernetes.default.svc
      source:
        repoURL: https://github.com/bbomar-reveal/pub.git
        targetRevision: HEAD
        path: '{{.path}}'
        helm:
          parameters:
            - name: domainName
              value: '{{ index .metadata.labels "domainName" }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m